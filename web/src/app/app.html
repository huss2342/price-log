@if (demo) {
  <!-- Said plainly rather than implied. The numbers are invented, and a visitor
       is entitled to know that before reading any of them as advice. -->
  <p class="demo-banner"><strong>Demo</strong> sample prices, not real ones</p>
}

<router-outlet />

<nav class="tabs" aria-label="Main">
  @for (tab of tabs(); track tab.path) {
    <a [routerLink]="tab.path" routerLinkActive="active" ariaCurrentWhenActive="page">
      <app-icon [name]="tab.icon" [size]="24" />
      <span>{{ tab.label }}</span>
    </a>
  }
</nav>
